# The memory map of the IIgs program, for ld65.
#
# Each area is a fixed place of the IIgs memory (src/host_memory.inc names the
# same places for the code; src/game.s checks that they agree). An area with a
# file writes its bytes to that file in the build folder, in the order of this
# list; fill = yes pads it to its size, so the next area of the file starts at
# its own address. scripts/boot_disk.py loads each file at its address.
#
# The host data that the asset builder makes (build/game/host_data.s) goes
# into the DATA, WORLD, VIDEO and LINKED segments: scripts/iigs_payload.py
# puts each blob into a segment with room (one bank, no blob crosses a bank)
# and ld65 places it there. define = yes gives the start and the size of each
# area (__NAME_START__, __NAME_SIZE__) to the asset build, to src/game.s and
# to debug.sym.

MEMORY {
    # Bank 0.
    GAMERAM:   start = $001000, size = $0E00, type = rw, file = "", define = yes;
    NATIVE:    start = $002000, size = $3000, file = "native.bin", define = yes;
    POOLRAM:   start = $005000, size = $1000, type = rw, file = "", define = yes;
    BOOT:      start = $006000, size = $0200, file = "host-boot.bin", fill = yes, define = yes;
    SOUND:     start = $006200, size = $1E00, file = "host-boot.bin", define = yes;
    A_WORLD:   start = $00A000, size = $0C00, file = "boot-a-world.bin", fill = yes, define = yes;
    C_WORLD:   start = $00C000, size = $1000, file = "boot-c-world.bin", fill = yes, define = yes;
    D_WORLD:   start = $00D000, size = $2B00, file = "boot-d-world.bin", fill = yes, define = yes;

    # Bank 1. The boot loader loads LC_WORLD and BC_WORLD at LC_WORLD_STAGE;
    # the handoff moves them in place.
    GAMEPLAY:  start = $010000, size = $8000, file = "gameplay.bin", define = yes;
    BANK1RAM:  start = $018000, size = $1000, type = rw, file = "", define = yes;
    LOW_WORLD: start = $019000, size = $2000, file = "low-world.bin", fill = yes, define = yes;
    # B_WORLD: world data around the cabinet scores and the world slots.
    B_WORLD0:  start = $01B000, size = $0300, file = "low-world.bin", fill = yes, define = yes;
    CABSCORES: start = $01B300, size = $0050, file = "low-world.bin", fill = yes, define = yes;
    B_WORLD1:  start = $01B350, size = $00B0, file = "low-world.bin", fill = yes, define = yes;
    B_WORLD2:  start = $01B400, size = $0C00, file = "low-world.bin", fill = yes, define = yes;
    GAMEFLOW:  start = $01C000, size = $3400, file = "gameflow.bin", define = yes;
    LC_WORLD:  start = $01F400, size = $0C00, file = "boot-lc-world.bin", fill = yes, define = yes;
    BC_WORLD:  start = $00BC00, size = $0300, file = "boot-lc-world.bin", define = yes;

    # The payload, banks $02-$0F: host data, the far code, and the menu
    # snapshot with the menu code in it.
    DATA02:    start = $020000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA03:    start = $030000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA04:    start = $040000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA05:    start = $050000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA06:    start = $060000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA07:    start = $070000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA08:    start = $080000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA09:    start = $090000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA0A:    start = $0A0000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA0B:    start = $0B0000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA0C:    start = $0C0000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    DATA0D:    start = $0D0000, size = $10000, file = "payload.bin", fill = yes, define = yes;
    # Bank $0E: the far code, each part in one bank (its near calls and its
    # code-bank data), the input code on a page; then host data.
    INPUT:     start = $0E0000, size = $5600, file = "payload.bin", fill = yes, define = yes;
    DISPLAY:   start = $0E5600, size = $0F00, file = "payload.bin", fill = yes, define = yes;
    SPECIAL:   start = $0E6500, size = $0A00, file = "payload.bin", fill = yes, define = yes;
    CABDATA:   start = $0E6F00, size = $0800, file = "payload.bin", fill = yes, define = yes;
    FMEXTRA:   start = $0E7700, size = $0900, file = "payload.bin", fill = yes, define = yes;
    DATA0E:    start = $0E8000, size = $6000, file = "payload.bin", fill = yes, define = yes;
    # The host data that holds linked Second Sight helpers: the link decides
    # its size (scripts/iigs_payload.py, src/host_jobs.inc).
    LINKED:    start = $0EE000, size = $2000, file = "payload.bin", fill = yes, define = yes;
    # Bank $0F: the menu keeps card SRAM $0000-$FFFF here
    # (src/menu_mirror_host.s); the menu code runs from the scratch part of
    # the card receive packet in it.
    SNAPSHOT0: start = $0F0000, size = $4000, file = "payload.bin", fill = yes, define = yes;
    MIRROR:    start = $0F4000, size = $0400, file = "payload.bin", fill = yes, define = yes;
    SNAPSHOT1: start = $0F4400, size = $BC00, file = "payload.bin", fill = yes, define = yes;

    # Banks $E0 and $E1: the card owns the display, so the IIgs video RAM
    # holds slow data (each blob inside one bank).
    VIDEO_E0:  start = $E02000, size = $A000, file = "video-e0.bin", define = yes;
    VIDEO_E1:  start = $E12000, size = $A000, file = "video-e1.bin", define = yes;
}

SEGMENTS {
    CODE:        load = BOOT, type = ro;
    SOUND:       load = SOUND, type = ro;
    NATIVE:      load = NATIVE, type = ro;
    GAMEPLAY:    load = GAMEPLAY, type = ro;
    GAMEFLOW:    load = GAMEFLOW, type = ro;
    INPUT:       load = INPUT, type = ro;
    INPUT_LATE:  load = INPUT, type = ro, optional = yes;
    DISPLAY:     load = DISPLAY, type = ro;
    SPECIAL:     load = SPECIAL, type = ro;
    CABDATA:     load = CABDATA, type = ro;
    SOUND_EXTRA: load = FMEXTRA, type = ro;
    MIRROR:      load = MIRROR, type = ro;
    GAMERAM:     load = GAMERAM, type = bss;
    POOLRAM:     load = POOLRAM, type = bss;
    BANK1RAM:    load = BANK1RAM, type = bss;

    # The host data (build/game/host_data.s).
    DATA02:      load = DATA02, type = ro, optional = yes;
    DATA03:      load = DATA03, type = ro, optional = yes;
    DATA04:      load = DATA04, type = ro, optional = yes;
    DATA05:      load = DATA05, type = ro, optional = yes;
    DATA06:      load = DATA06, type = ro, optional = yes;
    DATA07:      load = DATA07, type = ro, optional = yes;
    DATA08:      load = DATA08, type = ro, optional = yes;
    DATA09:      load = DATA09, type = ro, optional = yes;
    DATA0A:      load = DATA0A, type = ro, optional = yes;
    DATA0B:      load = DATA0B, type = ro, optional = yes;
    DATA0C:      load = DATA0C, type = ro, optional = yes;
    DATA0D:      load = DATA0D, type = ro, optional = yes;
    DATA0E:      load = DATA0E, type = ro, optional = yes;
    LOW_WORLD:   load = LOW_WORLD, type = ro, optional = yes;
    B_WORLD0:    load = B_WORLD0, type = ro, optional = yes;
    B_WORLD1:    load = B_WORLD1, type = ro, optional = yes;
    B_WORLD2:    load = B_WORLD2, type = ro, optional = yes;
    LC_WORLD:    load = LC_WORLD, type = ro, optional = yes;
    BC_WORLD:    load = BC_WORLD, type = ro, optional = yes;
    A_WORLD:     load = A_WORLD, type = ro, optional = yes;
    C_WORLD:     load = C_WORLD, type = ro, optional = yes;
    D_WORLD:     load = D_WORLD, type = ro, optional = yes;
    VIDEO_E0:    load = VIDEO_E0, type = ro, optional = yes;
    VIDEO_E1:    load = VIDEO_E1, type = ro, optional = yes;
    LINKED:      load = LINKED, type = ro, optional = yes;
}

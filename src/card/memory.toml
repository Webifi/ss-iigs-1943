# The memory map of the Second Sight: its regions, layout symbols and checks.
#
# Addresses: "load" is the load address of the first byte of a region
# (0x100000 + physical SRAM). A region without "load" loads no record; the
# build carries it another way (a host packet, or the entry staging).
# "run" is the Z180 logical address of the first byte of a code region. A
# region without "run" holds data: its labels are load addresses.
#
# Sections follow one another from the start of the region:
#   "SOURCE SECTION"               the next section, at the next address
#   "SOURCE SECTION run ADDRESS"   it runs at ADDRESS and loads in its place
#   "SOURCE SECTION window ADDRESS"  it runs at ADDRESS + its offset in the
#                                  region: the same SRAM seen through another
#                                  MMU window
#   "at ADDRESS"                   the next section starts at ADDRESS
#   "limit ADDRESS"                stop the build if the sections end after it
#   "free NAME KINDS END [align N] [view ADDRESS]"  free space up to END for
#                                  the allocator (scripts/card_layout.py), for
#                                  the section KINDS; VIEW is the run address
#                                  of code that runs in it through an 8 KB view
# "limit" of a region is the end that its sections may reach.
#
# Each region NAME gives the link the symbols NAME__run, NAME__end (after
# its last section), NAME__limit, NAME__size (limit - run) and NAME__load
# ("-" becomes "_"). A source
# can use LABEL__KIND for each formula kind of scripts/asset_source.py.
# [[check]] entries become ld ASSERTs of the final link. [symbols] are fixed
# addresses and values.

# SRAM that the firmware uses until the entry code runs (load addresses,
# [start, end)): page C, the SetPalette buffer, and the firmware ranges
# after the vectors, the SRAM test byte, the RST 38 body, the debug RETs
# and the stack at $032E-$03FF. The build loads their bytes into the video
# RAM staging area; the entry staging copies them in place. The menu entry
# saves low SRAM and rebuilds the ROM image; the menu return restores it.
staged = [
  [0x10C000, 0x10D000],
  [0x10F000, 0x10F300],
  [0x100004, 0x100038],
  [0x10003C, 0x100080],
  [0x100080, 0x1001FC],
  [0x100208, 0x10032A],
  [0x100A00, 0x100C00],
]


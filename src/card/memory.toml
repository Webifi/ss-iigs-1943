# Checks of the final link: an ld expression and the error message.
[[check]]
expression = "repair_core_end <= 0x5DA0"
message = "the repair code exceeds the ship staging buffer"

# The entry staging copies the runtime block over the entry mode table and
# the setup code before monitor_timing_ready, which do not run again.
[[check]]
expression = "entry_mode_data <= entry_runtime__run"
message = "the entry mode table starts after the runtime block"

[[check]]
expression = "entry_runtime__end <= monitor_timing_ready"
message = "the runtime block overwrites entry code that still runs"

[[check]]
expression = "monitor_timing_ready < entry_staging_call"
message = "the entry staging call comes before the monitor timing setup"

